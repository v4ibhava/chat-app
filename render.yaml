services:
  - type: web
    name: chat-app-backend
    runtime: node
    plan: free
    buildCommand: cd backend && npm install
    startCommand: cd backend && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: FRONTEND_URL
        value: https://zync-git-master-fantasize-projects.vercel.app
      - key: MONGODB_URI
        sync: true
      - key: JWT_SECRET
        sync: true
      - key: CLOUDINARY_CLOUD_NAME
        sync: true
      - key: CLOUDINARY_API_KEY
        sync: true
      - key: CLOUDINARY_API_SECRET
        sync: true
      - key: SMTP_HOST
        sync: true
      - key: SMTP_PORT
        sync: true
      - key: SMTP_USER
        sync: true
      - key: SMTP_PASSWORD
        sync: true
    healthCheckPath: /health
    healthCheckInterval: 300
    autoDeploy: true
